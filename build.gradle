// 검증 도구 버전을 고정해 로컬과 독립 검증에서 같은 규칙을 적용한다.
plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.nelson'
version = '1.0.0'

// 실행·컴파일 대상과 표준 API를 Java 17로 일치시킨다.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories { mavenCentral() }

// H2와 JWT 구현은 런타임에만 두고 테스트 지원 도구는 운영 의존성에서 분리한다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'com.h2database:h2'
    // 스키마 변경을 버전 관리되는 SQL로 적용한다. H2 지원은 flyway-core에 포함돼 있다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    // API 명세(/v3/api-docs)와 Swagger UI를 코드에서 생성한다. 버전은 Spring Boot 3.3과 맞춰 고정한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JUnit 5로 실행하고 실패 원인을 생략하지 않아 검증 결과를 재현할 수 있게 한다.
tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// 한글 주석은 보존하고 AOSP 4칸 포맷과 미사용 import 제거를 전체 Java에 적용한다.
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'configuration', {
        target '.editorconfig', 'build.gradle', 'config/checkstyle/*.xml', 'src/**/*.yaml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// 경고도 실패로 처리하며 포맷 외의 실수 가능한 코드 구조를 검사한다.
checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxErrors = 0
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

// CI와 로컬 모두 check 하나로 테스트·포맷·lint를 통과해야 한다.
tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}
