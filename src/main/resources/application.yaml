spring:
  datasource:
    url: jdbc:h2:file:./data/remittance;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password: ${REMITTANCE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
  jackson:
    time-zone: Asia/Seoul
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
remittance:
  aes-key: ${REMITTANCE_AES_KEY}
  jwt-secret: ${REMITTANCE_JWT_SECRET}
  usd-to-krw: ${REMITTANCE_USD_TO_KRW:1300}
  jpy-to-krw: ${REMITTANCE_JPY_TO_KRW:9}

# DB 제약 오류의 원시 메시지에는 userId가 포함될 수 있어 해당 진단 로그를 차단한다.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
