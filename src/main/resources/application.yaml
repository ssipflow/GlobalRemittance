spring:
  # 프로파일을 지정하지 않으면 postgres 프로파일(application-postgres.yaml)을 쓴다. 로컬 DB는 docker-compose.yml로 띄운다.
  # SPRING_PROFILES_ACTIVE를 지정하면 이 기본값은 적용되지 않는다. 그래서 아래 H2 파일 DB 설정은 postgres가 아닌
  # 프로파일(h2·local·test)의 기준값으로 남긴다. PostgreSQL과 local을 함께 쓰려면 postgres,local로 둘 다 지정한다.
  profiles:
    default: postgres
  # 프로젝트 하위 파일 DB(h2 프로파일)이며 사용자 홈 DB와 H2 콘솔 접근을 피한다.
  datasource:
    url: jdbc:h2:file:./data/remittance;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=${remittance.lock-timeout-ms}
    username: sa
    password: ${REMITTANCE_DB_PASSWORD:}
  # 웹 요청까지 영속 세션을 유지하지 않고 저장 시각은 UTC로 통일한다.
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 엔티티와 어긋나면 기동을 거부하도록 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # 스키마 변경은 db/migration의 V<번호>__*.sql로만 한다. 이력이 없는 기존 DB(ddl-auto로 만든 파일)는
  # 버전 0으로 기준선을 잡고 V1부터 다시 적용하며, V1·V2는 이미 있는 객체를 건너뛰게 작성돼 있다.
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
  h2:
    console:
      enabled: false
  jackson:
    time-zone: Asia/Seoul
# 오류 세부 내용과 스택에 포함될 수 있는 개인정보를 응답에 노출하지 않는다.
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
# 암호 키는 환경에서 필수로 공급한다. 환율은 외부 실시간 API가 아닌 구성 기본값이다.
remittance:
  aes-key: ${REMITTANCE_AES_KEY}
  jwt-secret: ${REMITTANCE_JWT_SECRET}
  usd-to-krw: ${REMITTANCE_USD_TO_KRW:1300}
  jpy-to-krw: ${REMITTANCE_JPY_TO_KRW:9}
  # 사용자 행 잠금을 기다리는 최대 시간(ms)이다. H2는 URL의 LOCK_TIMEOUT, postgres 프로파일은 연결별 SET lock_timeout으로 적용한다. 초과하면 503 LOCK_TIMEOUT이다.
  # 허용 범위는 1~30000이며 벗어나면 DB 연결 전에 기동을 거부한다(대기 요청이 스레드·연결을 오래 점유하지 않게 한다).
  lock-timeout-ms: ${REMITTANCE_LOCK_TIMEOUT_MS:5000}
  # PostgreSQL JDBC 소켓 읽기 대기 한도(초)다(postgres 프로파일만 적용, H2는 무관). DB가 응답 없이 멈췄을 때 요청이 이 시간 뒤 503 DB_UNAVAILABLE로 끝난다.
  # lock-timeout-ms 최대값(30초)보다 커야 하므로 31 이상을 권장한다. 기본 60초.
  db-socket-timeout-seconds: ${REMITTANCE_DB_SOCKET_TIMEOUT_SECONDS:60}
  # 환율 공급처와 신선도 정책이다. 잘못된 값은 기동 시점에 거부한다.
  rates:
    # configured(설정 환율) | simulated(지연·장애를 주입하는 모의 공급처, 운영 사용 금지)
    source: ${REMITTANCE_RATES_SOURCE:configured}
    # 환율 기준 시각이 현재와 이 초를 초과해 벗어나면(같으면 신선) 견적 발급을 503 RATE_STALE로 거부한다(1~3600).
    max-age-seconds: ${REMITTANCE_RATES_MAX_AGE_SECONDS:60}
    simulated:
      # 모의 환율의 기준 시각을 이만큼(초, 0 이상 정수) 과거로 돌린다.
      age-seconds: ${REMITTANCE_RATES_SIMULATED_AGE_SECONDS:0}
      # true면 환율 조회가 실패해 견적 발급이 503 RATE_UNAVAILABLE이 된다.
      unavailable: ${REMITTANCE_RATES_SIMULATED_UNAVAILABLE:false}

# API 명세와 Swagger UI는 함께 켜고 끈다. 외부에 노출하지 않을 환경에서는 REMITTANCE_API_DOCS_ENABLED=false로 끈다.
springdoc:
  # 오류 처리용 /error는 공개 API가 아니므로 명세에서 뺀다.
  paths-to-exclude: /error
  api-docs:
    enabled: ${REMITTANCE_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${REMITTANCE_API_DOCS_ENABLED:true}
    path: /swagger-ui.html

# DB 제약 오류의 원시 메시지에는 userId가 포함될 수 있어 해당 진단 로그를 차단한다.
# 요청 ID(MDC requestId)를 로그 수준 옆에 붙여 응답 헤더 X-Request-Id와 로그를 연결한다.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
